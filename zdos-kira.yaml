version: "3.0"
project: ZDOS-K.I.R.A
frontend:
  host: github-pages
  static: true
  api_base_config: config.js
backend:
  runtime: node >=18
  host: user-managed-vps
  bind: 127.0.0.1
  reverse_proxy: https-required
  authentication: single-admin-password-and-expiring-bearer-token
  cors_allowlist: ALLOWED_ORIGINS
ai:
  provider: openai-compatible-chat-completions
  credential_source: LLM_API_KEY-on-server-only
  available_modes: [assistant, writing, coding]
safety:
  shell_commands: disabled
  network_scanning: disabled
  wallet_transactions: disabled
  token_accounting: disabled
  sandbox_execution: disabled
